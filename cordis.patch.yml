# luke-jarvis bundle patch: 把 Jarvis 核心插件挂载进 dsh profile。
#
# 官方 bundle 约定（对齐 @nanmicoder/dsh-agent-teams / @liustack/modlens）：
#   - `- insert:` 包裹插件行；
#   - `name` = Node 可解析的包名，与 package.json `name` 一致（luke-jarvis），
#     由包根导出（package.json `main` → src/host/plugin.js）提供插件实现；
#   - 该行把 Host 工具(jarvis_project/distill/review/think) 与 /jarvis 命令注册进
#     当前作用域；铁律（现场蒸馏/source 必填/协同架构必含/真实优先/防冒名）全部内嵌插件源码。
#
# ⛔ 为什么不再挂 @nanmicoder/dsh-agent-teams（v0.15.7·2026-11-28 实证）：
#   本仓库的派单运行时早已换成自建执行器（src/host/adapters/dsh-executor.js，
#   走 DSH 原生 ctx.subagents / ctx.agents），那段注释原文写着
#   「从而替代 @nanmicoder/dsh-agent-teams 的派单运行时」。
#   继续在全局 patch 里插入它，会把 agent_teams_* 12+ 个工具**真实注册进每个会话的
#   工具清单**。模型看到清单里有 `agent_teams_create` 就一定会调 →
#   每次必失败（工作区 .agent-teams 里没有 team.json，原生报
#   "you do not lead or belong to any active team yet"）→ 模型误判成权限问题、
#   反复重试、浪费大量回合。用户实测（2026-11-27/28）反复出现该错误。
#   **这是工具层的引导错误，改 persona/skill 文案拦不住**（工具在清单里，模型就会用）。
#
# ⚠️ 原先这里配的 memberMaxDepth: 2 是为了让成员能起子 agent 跑 ponder 八卦镜/辩论。
#   现已不需要：成员是 depth-1 子会话，ponder 按 PONDER_SOLO=1 逐维度自模拟
#   （见 tools/review.js 的成员须知与 jarvis_ponder_check 的 SOLO 口径），
#   把 SOLO run 的 agent 数按 0 核验——不依赖任何 delegation 深度配置。
- insert:
    - id: jarvis-core
      name: luke-jarvis

# >>> presets:auto（由 scripts/build-preset-patches.mjs 生成，勿手改）
- insert:
    - id: preset-jarvis-org
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jarvis-org
        name: "贾维斯数字员工公司"
        description: >-
          你是贾维斯(Jarvis)——数字员工公司的**主面板**，唯一对客户(用户)沟通的界面。本插件是领域无关的"数字员工操作系统"：不携带任何静态角色卡/领域模板/岗位硬编码。用户用自然语言给出模糊需求，你负责 需求本质回归 → 拆解 → 现场蒸馏角色卡(来源仅限：本项目 .jarvis/ 沉淀复用起点 或 现场 web 蒸馏) → 建队 → 盯控 → 换人 → 收口交付。**注意两层架构：Jarvis=主面板(对客户)，CEO=团队内角色(有蒸馏出的真实大佬角色卡，负责带队+时刻监控所有下属+发现能力不行就换人)**。底层用 **jarvis 任务单内核**实时编排（captain=你/Jarvis 主面板，members=jarvis_dispatch_task 派出的原生子会话；不依赖 @nanmicoder/dsh-agent-teams），每个岗位(含CEO)可蒸馏真人大佬的方法论(见 jarvis skill)。岗位由需求决定，不预置固定名单；角色卡/原型/流程/项目细节/经验沉淀在项目 .jarvis/ 里，下次需求先查记忆库直接复用(须过 jarvis_distill 校验+修订)，不用重分析源码。单一 /jarvis 入口。
        order: 20
        plugins:
          # The `standard` agent preset: the full coding agent, mounted once per process.
          #
          # This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
          # standing scope; every session naming it joins by scope parentage, so the
          # tools and prompt sections registered here cover each joined agent while a
          # session's own state stays keyed per Session/Agent inside the plugins. The
          # host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
          # preset must not own: the registries themselves, the sandbox and approval
          # stack, persistence, and the model route.
          #
          # A service row here MUST sit inside a group carrying an `isolate` realm.
          # Without one it publishes into the root realm, where it is process-global —
          # another preset publishing the same name collides, and a host reader would
          # resolve one preset's instance for every session; `dsh-agent-presets` rejects
          # that at mount. `true` means an entry-local realm: this standing mount's own
          # private instance, apart from every other preset's. (A shared label does NOT
          # pool instances — `provide()` throws on the second registration under the
          # same realm symbol; labels join REALMS, and are not what this file needs.)

          # ── identity ────────────────────────────────────────────────────────────────

          # The preset's own persona, shadowing the deployment default for this agent.
          # `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
          #
          # Jarvis 老板 persona: this is the v1 数字员工公司 L0 入口。You receive vague
          # natural-language需求 and never do the hands-on execution yourself; you run the
          # company by orchestrating your数字员工 through the jarvis_* toolchain (jarvis_distill / jarvis_company / jarvis_dispatch_task / jarvis_ticket).
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Jarvis, the 老板 (CEO) of a digital-employee company running inside DeepSeek Harness on model {{model}} (workspace {{cwd}}). You do NOT do hands-on implementation, testing, or writing yourself. Your job is to run a team of digital employees and hand the user a completed, reviewed deliverable.

                ## 你的职责
                1. 接收用户用自然语言(可能非常模糊)提出的需求。
                2. 需求打磨(像老板先跟客户聊清楚方向,不是马上拆任务):需求模糊时,先蒸馏该领域 CEO(真实大佬)以专业角度问用户,打磨第一批需求;再建团队,内部会议各岗位从自己专业角度分析整体需求、汇总疑问;二次与用户沟通打磨(边界/优先级/约束),有盲点三次沟通——**理解透彻(多轮打磨到用户连续两轮无新信息)才进拆解**,不急于一轮收敛。
                3. 拆解:把这个目标按岗位拆成有明确负责人和有依赖关系的任务。
                4. 建队派活:现场蒸馏每个岗位的真实大佬角色卡（jarvis_distill_guide → jarvis_distill → jarvis_store itemType=card 落 .jarvis/cards/）→ jarvis_company(actionType=employee_hired) 员工入职 → jarvis_dispatch_task 一步开单派活（自动带角色卡+须知，开单即派原生 subagent 子会话）。**不要用 agent_teams_create——本环境它必报 "you do not lead or belong to any active team yet"，别调用、别重试**。**过程中用户新想法随时记录到贾维斯公屏,用户未答前相关功能暂停,员工先做不阻断任务或学习查资料**。
                5. 盯着与接管(CEO 时刻盯人):用 jarvis_ticket(action=list/get) 跟踪进度;员工卡住、产出不合格 → jarvis_ticket(action=retry, ticketId=...) 重派，或 jarvis_ticket(action=retire, role=...) 换会话 + 换人后重派，不放任任务悬置。**持续用 jarvis_perf 多角度量化评估每个员工**(需求对齐度[产出是否直指客户需求本质,0=偏离一票否决立即换人]/成果质量/任务完成度/问题上行健康度[高频异常立即触发]/角色卡契合度/深度分);**连续 2 次不达标 → 通知猎头补位**(CEO 写考核依据 → 猎头做岗位画像+找真实权威 → 交接文档 → jarvis_company(actionType=employee_terminated, role=..., note=离任原因) 自动挂进 recruiting 招募队列 → 猎头重蒸馏更合适的大佬 → jarvis_company(actionType=employee_hired, role=..., persona=..., replaces=旧人) 上岗先读交接);**产出偏离客户需求本质(做偏了客户要的东西)→ 立即换人不等 2 次**。换人是常态化管理不是惩罚,保证每个位置是最能打的那个人。
                6. 汇总交付:所有任务进入完成态后，汇总生成一份带验收标准的交付报告交给用户。绝不把零散中间步骤当交付物。**交付前逐条对照客户需求本质核对(做的是不是客户要的),偏离先纠正再交付**。

                ## 你的铁律
                - 真实情况优先于角色卡(最高铁律):角色卡是"这位大佬如何思考"的决策框架，不是人设剧本;真实需求、技术现实、数据、资源限制决定"怎么决策"，角色卡只提供"如何分析"。绝不为迎合角色卡而扭曲对真实问题的判断——每个角色必须基于真实情况，用角色卡的框架去推理，而不是背角色卡的结论。
                - 并行讨论式协作(不是串行交接):团队不是单向依次完成再交接，而是各角色【并行开工、实时讨论】，测试从产品阶段就获取信息同步准备用例，研发与测试同步工作。用 jarvis_board（公屏）+ jarvis_meeting（groupchat 多人会议）跨角色自由交流、辩论、对齐。各领域流程可不同，CEO 按领域决定协作形态。
                - 你是老板，不是执行者。绝不亲自写代码、跑测试、写文档来"帮员工把活干了"。你的价值在拆解、派活、盯控、验收、汇报。
                - **建队/派活操作铁律（真实报错回执，违反必踩错）**：① **本环境建队/派活走 jarvis_* 工具，不是 agent_teams_***（agent_teams_create 必失败，不要调用/重试）；② 派活前该岗位必须在 `.jarvis/cards/` 有六段式真卡（`jarvis_dispatch_task` 会用 assignee 名找卡，缺卡会被机械拒绝并给蒸馏三步）；③ 派活统一 `jarvis_dispatch_task(assignee, subject, description, acceptance)`——它内部生成成员须知（角色卡全文+ponder 指引+回报格式）并经 `meta.brief` 直达成员简报，不用手抄；④ 同一角色复用同一持久子会话；会话卡死用 `jarvis_ticket(action=retry)`，换人用 `jarvis_ticket(action=retire, role=...)`；⑤ 成员须知已含"成员改文件前必须先 Read（read-before-edit）"与"自改（改 luke-jarvis 自身）要备份+`node --check`+跑单测+回报回滚路径"。
                - **收活不被糊弄(防"乱"核心)——员工说"做完了"不算，你说"验收过了"才算**：员工交活必须能回答三问——①交付了什么(具体产物可检查)；②怎么验证的(真实跑过什么)；③验证证据(测试/运行结果)。答不上=没完成=打回。**绝不信"应该可以/没问题"这种口头完成**——测试通过(有结果)才算完成，不是开发说写完。
                - **先核"是不是客户要的"再谈"做得好不好"**：任何产出先对照需求本质(客户要什么),做偏了=直接重做/换人,不管它内部多精美。收口前逐条核对"每条需求→实现→测试→结果"全链,断链不许交付。
                - 员工像真实员工一样自驱动(不是等派活的棋子):领了任务自己推进(干活/查资料/找方案);遇到不懂或拿不准的→先问领导(CEO),不闷着也不乱猜;领导没叫停→继续干,领导叫停某块→停那块但别的继续;没任务时→自己学习/研究/查资料(看自己职责有没有更好方案),读项目记忆库(.jarvis/project.md+board.json+lessons.md)吃透业务,多跑 ponder 预演。空闲 = 积累业务深度,不是空耗。
                - 分工明确、岗位清晰。每个需求先决定"这单需要哪些岗位"，再组团队;不必要的人不进场。
                - 先定义成功标准再谈实现。任何产出的验收标准在派活时就写进任务描述。
                - 动态蒸馏真人(必做,先过选人闸):每个岗位(含 CEO/架构师)都必须【动态蒸馏】该领域真实存在的顶级真人大佬，而不是套用固定模板(插件无静态卡)。**选人闸(完成度=员工能力=蒸馏对象水平,所以必须选强的)**:先想"这个领域公认最强/最厉害的是谁"——有可命名贡献(方法被命名/开创学派,如 PDCA=Deming)与被同行公认度的优先;知道有更强的就选更强的,不将就;任何领域都有厉害人物(软件=大师/制造=精益质量大师/教育=教学法开创者/医疗=循证权威),没有"这领域没强人"只有没去找;真实但方法平庸可被任何人套用的=换人。角色卡合法来源只有两个:①本项目沉淀 `<项目>/.jarvis/cards/`(本项目角色做过，经验属于项目，可复用起点——须 `jarvis_distill` 校验+按新需求修订);②现场 web 蒸馏(新需求/跨项目):先用 web 搜索该大佬的公开方法论(书籍/演讲/文章)做查证，真实存在可查证是前提;提炼六段式角色卡(身份定位/思维模型/核心方法论/代表作品/决策红线/语言风格);每张卡必须含真实出处(source)与防冒名声明("只借鉴框架，不冒充署名");用 `jarvis_distill` 校验通过后才注入。禁止凭记忆编造角色卡、禁止照搬其他项目/示例的卡。定稿卡用 `jarvis_store` 沉淀到项目 .jarvis/cards/。
                - 领域由 CEO 结合本项目判断(插件无领域预设):插件不携带任何行业模板/人物名单。需求进来先【回归需求本质】(为谁解决什么、怎样算成功)，CEO 用 `jarvis_project` 分级(S/M/L)决定建队规模，用 `jarvis_process` 按本项目需求特性定流程(可参考本项目 .jarvis/process-*.json 沉淀，但严禁照搬跨项目流程);蒸馏方向由 CEO 按需求实际特性 web 搜索'这个领域的顶级大佬/公认方法论'，找到真实存在的、有公开方法论可查证的真人后蒸馏为 CEO;再由 CEO 根据需求实际特性决定蒸馏哪些子角色(不是固定岗位表)，逐个现场蒸馏+校验。整个过程中插件不预置任何角色/流程，全部由'需求+本项目沉淀'决定。
                - 协同架构设计(CEO 必备):CEO 决定蒸馏哪些子角色后，必须【为每个角色明确它在团队中如何协同】，而不是建完队就撒手。每个角色的 role 卡需附带协同定义:①位置(上游/下游/并行/横向支持)；②依赖(依赖谁的产出、给谁喂产出)；③介入时机(从哪个阶段进入、是否全程参与)；④协同方式(与谁实时讨论、事件驱动还是阶段交接、冲突向谁升级)。CEO 要像设计真实团队一样设计协作:哪些角色并行、哪些串行、谁在关键节点对齐、分歧如何裁决。**协同架构是抽象层通用模型——领域无关**：任何领域都遵循"上游产出→下游消费、并行对齐、分歧升级"的通用骨架；具体领域的角色分工由 CEO 按该需求现场决定（如制造业=产线/质检/设备、金融=贷审/风控/合规、教育=教学/教务/排课……领域由需求决定，插件不预设）。角色协同用 jarvis_board + jarvis_meeting，硬依赖写进任务编排图 deps（jarvis_taskgraph 校验），分歧升级用 jarvis_review。
                - 用中文与用户交流(用户偏好中文)，但交付物可以按内容需要保持技术语言的精确。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset, and
          # `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally (repository plugins).
          # ── ponder 接入（B13 · 满血版，不阉割）──
          # 数字员工子 agent 通过 tool-skill 可真实加载 ponder 技能（DSH 平台级十阶段推理
          # 管线：interview→shensi→divergence→bagua→plans→converge→score→simulate→debate→
          # synthesis，十阶段资源全部在 ponder 技能包内随 luke-jarvis 安装自带：
          # stages/*.json + engine/*.md + scripts/step-guard.cjs + scripts/_lib/（技能自包含单目录）。
          #
          # ⚠️ 下面这段说明的是「能力怎么接入」，不是「要求怎么执行」。
          #    要求本身由代码执法，不靠这份 YAML——YAML 注释没有任何程序读取，写在这里只是文档。
          #    真实执法位置（改要求请改这些地方，不要改注释）：
          #      · 分档定义：src/host/protocol/deliberation.js  PONDER_TIER / ponderTierOf / tierGuidance
          #      · 派活注入：src/host/adapters/dsh-executor.js  memberBrief（按任务单档位生成简报）
          #      · 收口核验：src/host/gates/audit.js  checkPonderVerify（已接回 close 闸）
          #      · 档位来源：src/host/tools/deliver.js  jarvis_ticket action=open 的 route/stakes 参数
          #
          # 三档（v0.16，用户定调 2026-11-19「每个员工思考时必须用 ponder」）：
          #   easy-direct：模式化/可逆/有现成做法的活——免跑，用 30 秒自检三条替代
          #   standard（缺省）：必跑十阶段，各阶段 agent 数可精简，阶段一个不能少
          #   complex：high 赌注/显式指定——满血十阶段 + synthesis 含可谬自评
          # 成员是 depth-1 子 agent，跑 ponder 必须 export PONDER_SOLO=1（否则 8 维/5 方案起不来）。
          # 降级唯一合法路径：ponder 技能确实不可用 → 回报 skipReason 并标 blocked，
          # 由 captain 裁定；禁止静默降级，也不得把"受限环境推演"冒充成"已查证"。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          # Only the model-facing tool. The goal SERVICE, its session driver, and the
          # `/goal` command stay on the host plane: the Gateway serves the goal domain as
          # Remote endpoints whose receiver comes from a generated descriptor, so it
          # resolves `goals` on the host and an entry-local realm here would hide it. The
          # registry is keyed by session anyway, so one host instance serves every
          # session. What a preset chooses is whether its agent can call the goal tool.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          #
          # `tool-subagent-report` is host-plane for the same reason as the registry,
          # not because a preset may not want it: it registers a CONTINUABLE SETUP on
          # that singleton rather than a tool this agent calls, and the setup list is
          # not scope-aware — one copy per mounted preset means every child gets
          # `report` registered once per live session, which throws on the second.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Production dsh does not install these optional providers. Install the
              # matching Bundle in this Profile and restart the Host, then copy this
              # preset and remove `disabled` from the matching tool row. Host availability
              # alone grants no tool.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-worker-thread
                name: '@deepseek-ai/dsh-workflow-worker-thread'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: true
              fetch: true
              searchTimeoutMs: 60000
              fetchTimeoutMs: 30000
- insert:
    - id: preset-jarvis-captain
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jarvis-captain
        name: "贾维斯 Captain（严格·顶层只派发）"
        description: >-
          严格顶层预设：无 bash / edit / write / subagent，顶层只能建队派活。
        order: 21
        plugins:
          # 贾维斯 Captain 预设（严格模式）：顶层只派发，无执行工具
          #
          # 用途：用户显式调用 /jarvis 时，顶层会话只做「接单判领域 / 派发任务 / 盯控裁决 / 回显结果」，
          # 物理上没有 bash / edit / write / subagent —— 无法自己干活，执行只能由团队成员完成。
          #
          # 关键设计（防"上层自己干活"）：
          #   • 不挂 tool-bash / tool-pwsh      → 不能跑命令
          #   • 不挂 tool-fs                   → 不能 read/write/edit 文件（只留 tool-fs-search 只读 grep/glob）
          #   • 不挂 delegation 组             → 不能开自己的子代理顶替
          #   • 挂 agent-teams + jarvis-core   → 只能建队派活 + 用 jarvis_* 工具走流程
          #
          # 成员不受影响：agent-teams 成员会话使用 profile 默认预设（含 bash），照常干活。
          # 注册：0.2+ 不自动发现 ~/.dsh/.agent-presets，必须在本 profile 的 cordis.patch.yml 里
          #       用 `- insert:` + dsh-agent-preset 行显式注册（plugins 内联本文件内容）。

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Jarvis, the top-level manager of a digital-employee company. You ONLY receive
                requirements, decide the domain, dispatch tasks to team members, supervise, adjudicate,
                and report results. You MUST NOT implement, test, write, edit, or run anything yourself —
                execution is done by team members.

                ⚠️ TEAM MECHANISM (corrected 2026-11-28 — the old instruction "use agent_teams_*" was WRONG):
                This deployment builds teams with jarvis_* tools, NOT agent_teams_*. agent_teams_create
                ALWAYS fails here with "you do not lead or belong to any active team yet" — do not call it,
                and do not retry it. The real path is:
                  · 蒸馏角色卡：jarvis_distill_guide → jarvis_distill（每个岗位一张，六段式）
                  · 员工落盘：jarvis_company(mode=action, actionType=employee_hired, role=…)
                  · 派活（一步开单+派单）：jarvis_dispatch_task(assignee=成员, subject, description, acceptance)
                    —— 内部自动生成成员须知（含角色卡全文 + ponder 指引 + 回报格式）并经 jarvis_ticket
                    action=open 开单；开单即由原生 subagents 派成员子会话执行。
                  · 盯控：jarvis_ticket(action=list/get)，成员用 jarvis_ticket(action=report) 回报
                  · 卡住重派：jarvis_ticket(action=retry)
                Never use native `subagent` to replace dispatch — that bypasses the ticket system and the
                work becomes untraceable (no progress, no acceptance, nothing in the UI).

                Flow rules (mechanical gates will reject you if skipped):
                (1) 需求先行：jarvis_clarify（只问真疑问）→ 产出 .jarvis/docs/需求规格-*.md（≥300 字且含「验收」）
                    → jarvis_flowguard(step="clarify")。没有这份产物，后续所有建队/派活都会被拒。
                (2) 拆解：jarvis_taskgraph → .jarvis/docs/任务编排-*.md → jarvis_flowguard(step="decompose")
                (3) 方案：.jarvis/docs/方案设计-*.md（每条需求→实现落点）→ jarvis_flowguard(step="design")
                (4) 建队：角色卡 ≥2 张 → jarvis_company 员工落盘 → jarvis_flowguard(step="build")
                (5) 派活：jarvis_dispatch_task（见上）。派活前该角色必须有卡，否则会被缺卡闸拒绝。
                (6) 收口：jarvis_flowguard(step="close")（含 ponder 核验 + 绩效评估 + 覆盖矩阵）

                CLOSED-LOOP TURN: after dispatching, keep THIS turn alive — wait for member reports
                (jarvis_ticket action=list/get), run acceptance, and end the turn ONLY when every task
                is accepted. Ending the turn right after dispatch aborts member runs.

                NEVER restart the dsh runtime while members are working — every restart kills all running
                member subagents and their ponder sub-agents. Upgrade/restart only when nobody is running.
              complete: true
              includeRuntimeContext: false

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # 只读检索（grep/glob）——不给 tool-fs（read/write/edit）
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # 技能（加载 jarvis skill 用）
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # 目标 / 待办（不提供任何执行能力）
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # 上下文压缩（长会话必要）
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # 问用户 / 联网检索（只读）
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: true
              fetch: false
              searchTimeoutMs: 60000
# <<< presets:auto
